<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>Mini Puantaj</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ ANA EKRAN ============ -->
<section id="scrMain" class="screen active">
  <header class="topbar">
    <div class="datebox">
      <div id="mainDate" class="date"></div>
      <div id="mainSent" class="sent"></div>
    </div>
    <div class="topbtns">
      <button id="btnTanimlar" class="btn">Tanımlar</button>
      <button id="btnArsiv" class="btn">Arşiv</button>
    </div>
  </header>
  <div class="tablewrap">
    <table class="grid">
      <thead><tr><th>Adı Soyadı</th><th class="c-durum">Durumu</th><th class="c-sym"></th></tr></thead>
      <tbody id="mainBody"></tbody>
    </table>
    <div id="mainEmpty" class="empty hidden">Henüz personel tanımlanmamış.<br>“Tanımlar” ekranından personel ekleyebilirsiniz.</div>
  </div>
  <footer class="bottombar">
    <textarea id="txtAciklama" placeholder="Açıklama yazınız..." rows="2"></textarea>
    <button id="btnGonder" class="btn primary">GÖNDER</button>
  </footer>
</section>

<!-- ============ TANIMLAR ============ -->
<section id="scrTanim" class="screen">
  <header class="topbar">
    <div class="searchbox">
      <input id="txtAra" type="text" placeholder="İsim soyisim ara..." autocomplete="off">
      <button id="btnAraTemizle" class="xbtn" title="Temizle">✕</button>
    </div>
    <button id="btnPersonelEkle" class="btn">Personel Ekle</button>
  </header>
  <div id="chips" class="chips"></div>
  <div class="tablewrap">
    <table class="grid">
      <thead><tr><th>Adı Soyadı</th><th class="c-cins">Cinsiyeti</th></tr></thead>
      <tbody id="tanimBody"></tbody>
    </table>
    <div id="tanimEmpty" class="empty hidden"></div>
  </div>
  <footer class="bottombar split">
    <div style="display:flex;gap:8px">
      <button id="btnYedekle" class="btn">Yedekle</button>
      <button id="btnGeriYukle" class="btn">Geri Yükle</button>
      <input id="inpYedek" type="file" class="hidden">
    </div>
    <button id="btnTanimKapat" class="btn">Kapat</button>
  </footer>
</section>

<!-- ============ ARŞİV ============ -->
<section id="scrArsiv" class="screen">
  <header class="topbar"><div class="title">Arşiv</div></header>
  <div class="tablewrap">
    <table id="arsivTable" class="grid arsiv">
      <thead><tr><th class="c-zaman">Gönderme Zamanı</th><th>Personel Durumu</th></tr></thead>
    </table>
    <div id="arsivEmpty" class="empty hidden">Arşiv kaydı bulunmuyor.</div>
  </div>
  <footer class="bottombar split">
    <button id="btnArsivTumSil" class="btn danger">Tüm Arşiv Kayıtlarını Sil</button>
    <button id="btnArsivKapat" class="btn">Kapat</button>
  </footer>
</section>

<!-- ============ PENCERELER ============ -->
<div id="overlay" class="overlay hidden"></div>

<!-- Personel ekle / düzenle -->
<div id="dlgPersonel" class="dialog hidden">
  <div class="dlg-title"><span id="dlgPersonelTitle">Personel</span><button class="xbtn dark" data-close>✕</button></div>
  <div class="dlg-body">
    <label>Adı Soyadı<input id="inpAd" type="text" maxlength="80" autocomplete="off"></label>
    <label>Cinsiyeti
      <select id="inpCins">
        <option>Erkek</option><option>Kadın</option><option selected>Bilinmiyor</option>
      </select>
    </label>
    <label class="chk"><input id="inpPasif" type="checkbox"> Pasife Al</label>
    <div id="dlgPersonelErr" class="err"></div>
  </div>
  <div class="dlg-btns"><button class="btn" data-close>Vazgeç</button><button id="btnPersonelKaydet" class="btn primary">Kaydet</button></div>
</div>

<!-- Personel durum görüntüleme -->
<div id="dlgDurum" class="dialog yellow hidden">
  <div class="dlg-title"><span>Personel Durum Görüntüleme</span><button class="xbtn dark" data-close>✕</button></div>
  <div class="dlg-body"><table class="grid view"><thead><tr><th>Adı Soyadı</th><th class="c-durum">Durumu</th><th class="c-sym"></th></tr></thead><tbody id="durumGosterBody"></tbody></table></div>
  <div class="dlg-btns"><button class="btn primary" data-close>Tamam</button></div>
</div>

<!-- Onay -->
<div id="dlgOnay" class="dialog small hidden">
  <div class="dlg-title"><span id="onayTitle">Onay</span></div>
  <div class="dlg-body"><p id="onayMsg"></p></div>
  <div class="dlg-btns"><button id="onayHayir" class="btn">Hayır</button><button id="onayEvet" class="btn primary">Evet</button></div>
</div>

<!-- Uzun basma menüsü -->
<div id="popMenu" class="popmenu hidden">
  <button id="popSil">Kaydı Sil</button>
  <button id="popVazgec">Vazgeç</button>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
