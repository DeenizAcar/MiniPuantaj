name: APK derle ve GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm ci

      - name: Android projesi oluştur
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1f4e79' --splashBackgroundColor '#1f4e79' || echo "ikon üretimi atlandı"
          npx cap sync android
          # Personel uygulamasından personel okuma (PersonelKaynak)
          node scripts/android-ekle.js
          # her yayında sürüm artar: 1.0.<derleme no>
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # Her sürüm aynı anahtarla imzalanmalı; yoksa telefondaki uygulama güncellenemez.
      # Anahtar Gradle'a açıkça verilir; secret yoksa derleme durur (rastgele anahtarla APK çıkmaz).
      - name: Sabit imza anahtarı
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "DEBUG_KEYSTORE_B64 secret yok"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/minipuantaj.keystore"
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  sabit {
                      storeFile file("$RUNNER_TEMP/minipuantaj.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.sabit }
              }
          }
          GRADLE
          tail -16 android/app/build.gradle

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          # imzayı doğrula ve parmak izini logla
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - name: Site klasörünü hazırla
        run: |
          mkdir -p site/apk
          cp -r www/* site/
          cp android/app/build/outputs/apk/debug/app-debug.apk site/apk/MiniPuantaj.apk
          cp apk-page/index.html site/apk/index.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
